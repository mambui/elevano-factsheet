name: Publish factsheet

# Regenerates the factsheet once a day and publishes it as a static page on
# GitHub Pages (custom domain: factsheet.elevanocapital.com).
# If generation fails (Supabase down, not enough data), the deploy job is
# skipped and the previous version stays online.

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC daily, ahead of the former 01:00 regeneration
  workflow_dispatch:        # manual "Regenerate now" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate factsheet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FACTSHEET_OUTPUT: ${{ github.workspace }}/site/index.html
          MPLBACKEND: Agg
        run: |
          python generate.py
          # Fail the run (and keep the current page live) if nothing was produced
          test -s site/index.html
          grep -q "Elevano Capital" site/index.html

      - name: Upload page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
